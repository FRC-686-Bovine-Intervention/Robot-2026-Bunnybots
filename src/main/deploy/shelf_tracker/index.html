<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShelfTracker</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/shelf.css" />
    <link rel="stylesheet" href="./styles/slider.css" />
    <link rel="stylesheet" href="./styles/controls.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">
  </head>
  <body>
    <div id="left" class="controls">
      <div class="toggle">
        <p>Dumb</p>
        <label class="switch">
          <input id="mode" type="checkbox" />
          <span class="slider round"></span>
        </label>
        <p>Smart</p>
      </div>
      <div id="priority_list">
        <p>Priority List <span class="updated">✅</span></p>
        <div data-swapy-slot="0">
          <div
            class="priority"
            data-swapy-item="0"
            data-idx="0"
            data-level="3"
            data-kind="fill"
            data-count="5"
          >
            <span>Level 3 Fill</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="1">
          <div
            class="priority"
            data-swapy-item="1"
            data-idx="1"
            data-level="2"
            data-kind="fill"
            data-count="5"
          >
            <span>Level 2 Fill</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="2">
          <div
            class="priority"
            data-swapy-item="2"
            data-idx="2"
            data-level="1"
            data-kind="fill"
            data-count="5"
          >
            <span>Level 1 Fill</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="3">
          <div
            class="priority"
            data-swapy-item="3"
            data-idx="3"
            data-level="0"
            data-kind="fill"
            data-count="5"
          >
            <span>Oven Spam</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="4">
          <div
            class="priority"
            data-swapy-item="4"
            data-idx="4"
            data-level="3"
            data-kind="srp"
            data-count="3"
          >
            <span>Level 3 Stocked Up</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="5">
          <div
            class="priority"
            data-swapy-item="5"
            data-idx="5"
            data-level="2"
            data-kind="srp"
            data-count="3"
          >
            <span>Level 2 Stocked Up</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="6">
          <div
            class="priority"
            data-swapy-item="6"
            data-idx="6"
            data-level="1"
            data-kind="srp"
            data-count="3"
          >
            <span>Level 1 Stocked Up</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="7">
          <div
            class="priority"
            data-swapy-item="7"
            data-idx="7"
            data-level="3"
            data-kind="brp"
            data-count="1"
          >
            <span>Level 3 Baked Up</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="8">
          <div
            class="priority"
            data-swapy-item="8"
            data-idx="8"
            data-level="2"
            data-kind="brp"
            data-count="1"
          >
            <span>Level 2 Baked Up</span><span class="progress-bar"></span>
          </div>
        </div>
        <div data-swapy-slot="8">
          <div
            class="priority"
            data-swapy-item="8"
            data-idx="8"
            data-level="1"
            data-kind="brp"
            data-count="1"
          >
            <span>Level 1 Baked Up</span><span class="progress-bar"></span>
          </div>
        </div>
      </div>
      <div id="baker_mode">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chef-hat preview-icon"><path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z"/><path d="M6 17h12"/></svg>
    </div>
      <div id="rp_tracker">
        <div class="primary">
          <div class="rp" id="stockRp">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shelving-unit preview-icon"><path d="M12 12V9a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/><path d="M16 20v-3a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v3"/><path d="M20 22V2"/><path d="M4 12h16"/><path d="M4 20h16"/><path d="M4 2v20"/><path d="M4 4h16"/></svg>
            <span>Stocked Up RP</span>
          </div>
          <div class="rp" id="bakeRp">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-cake preview-icon"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/></svg>
            <span>Baked Up RP</span>
          </div>
        </div>
      </div>
    </div>
    <div id="tracker">
      <div id="shelf">
        <div class="rack">
          <div class="columns">
            <div class="column"><span class="column-text">1</span></div>
            <div class="column"><span class="column-text">2</span></div>
            <div class="column"><span class="column-text">3</span></div>
            <div class="column"><span class="column-text">4</span></div>
            <div class="column"><span class="column-text">5</span></div>
          </div>
          <div class="level">
            <div class="carrot"><div class="stripe"></div></div>
            <div class="carrot"><div class="stripe"></div></div>
            <div class="carrot"><div class="stripe"></div></div>
            <div class="carrot"><div class="stripe"></div></div>
            <div class="carrot"><div class="stripe"></div></div>
          </div>
          <div class="level">
            <div class="carrot"><div class="stripe"></div></div>
            <div class="carrot"><div class="stripe"></div></div>
            <div class="carrot"><div class="stripe"></div></div>
            <div class="carrot"><div class="stripe"></div></div>
            <div class="carrot"><div class="stripe"></div></div>
          </div>
          <div class="level">
            <div class="carrot"><div class="stripe"></div></div>
            <div class="carrot"><div class="stripe"></div></div>
            <div class="carrot"><div class="stripe"></div></div>
            <div class="carrot"><div class="stripe"></div></div>
            <div class="carrot"><div class="stripe"></div></div>
          </div>
        </div>
    </div>
    <div id="right" class="controls">
      <div id="ovenCarrots">
        <div id="subtract">-</div>
        <div id="counter">0</div>
        <div id="add">+</div>
      </div>
      <div id="ovenCakes">
        <div id="subtract">-</div>
        <div id="counter">0</div>
        <div id="add">+</div>
      </div>
    </div>
    <script src="./lib/swapy.min.js"></script>
    <script src="./scripts/index.js" type="module" defer></script>
  </body>
</html>
